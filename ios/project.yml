name: CeriseAR
options:
  bundleIdPrefix: br.ufg.cerise
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    branch: master

targets:
  CeriseAR:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: CeriseAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.ufg.cerise.arviewer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: CeriseAR/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Set your signing team in Xcode (Signing & Capabilities) after generating.
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: GLTFKit2
